name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - run: python -m pip install PySide6-Essentials==6.11.2 websockets==16.0
      - name: Install Rust build toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy && rustup default 1.88.0
      - name: Rust backend checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/perch-rust-target
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path backend/Cargo.toml
      - run: ./tests/run
